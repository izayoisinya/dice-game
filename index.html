<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ダイス戦記 プロトタイプ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ダイス戦記 <small>プロトタイプ</small></h1>
    <div class="controls">
      <label>モード
        <select id="mode">
          <option value="manual" selected>手動プレイ</option>
          <option value="auto">オート観戦</option>
        </select>
      </label>
      <button id="btn-form">🎲 編成</button>
      <button id="btn-start" disabled>⚔ 戦闘開始</button>
      <button id="btn-reset">↺ リセット</button>
      <label>速度
        <select id="speed">
          <option value="600">遅い</option>
          <option value="250" selected>普通</option>
          <option value="60">速い</option>
          <option value="0">一瞬</option>
        </select>
      </label>
      <label>総大将の出撃 P
        <select id="advance-player">
          <option value="hold" selected>全滅まで待機</option>
          <option value="r30">残り30%</option>
          <option value="r50">残り50%</option>
          <option value="now">最初から</option>
        </select>
      </label>
      <label>CPU
        <select id="advance-cpu">
          <option value="hold" selected>全滅まで待機</option>
          <option value="r30">残り30%</option>
          <option value="r50">残り50%</option>
          <option value="now">最初から</option>
        </select>
      </label>
    </div>
  </header>

  <div id="result" class="result hidden"></div>

  <details id="campaign-box" class="panel" open>
    <summary><h2>軍の編成 <small>ダイスで兵力を決め、隊を組んで出陣（戦略レイヤー試作）</small></h2></summary>
    <div id="campaign"></div>
  </details>

  <section id="cmd-editor" class="panel hidden"></section>

  <section class="armies">
    <div class="army player">
      <h2>プレイヤー軍 <span id="player-dice" class="dice"></span></h2>
      <div id="player-summary" class="summary"></div>
      <table>
        <thead><tr><th>名前</th><th>階級</th><th>兵種</th><th>HP</th><th>ATK</th><th>DEF</th><th>SPD</th><th>RNG</th><th>ACT</th><th>HIT</th><th>位置</th></tr></thead>
        <tbody id="player-units"></tbody>
      </table>
    </div>
    <div class="army cpu">
      <h2>CPU軍 <span id="cpu-dice" class="dice"></span></h2>
      <div id="cpu-summary" class="summary"></div>
      <table>
        <thead><tr><th>名前</th><th>階級</th><th>兵種</th><th>HP</th><th>ATK</th><th>DEF</th><th>SPD</th><th>RNG</th><th>ACT</th><th>HIT</th><th>位置</th></tr></thead>
        <tbody id="cpu-units"></tbody>
      </table>
    </div>
  </section>

  <section>
    <h2>戦場 <small id="turn-label"></small></h2>
    <div id="action-panel" class="panel action-panel hidden"></div>
    <div id="field" class="field"></div>
  </section>

  <section>
    <h2>バトルログ</h2>
    <div id="log" class="log"></div>
  </section>

  <script src="main.js"></script>
</body>
</html>
